[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["_backup_original"]

[tool.ruff.lint]
# E = style errors, F = real mistakes (unused imports, undefined names ...)
select = ["E", "F"]

[tool.pytest.ini_options]
# Lets the tests do "from services.x import y" from the project root
pythonpath = ["."]
testpaths = ["tests"]
