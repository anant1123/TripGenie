name: CI

# Runs on every push and pull request: style check + tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install -r requirements-dev.txt

      - name: Check code style and mistakes
        run: ruff check .

      - name: Run tests
        run: pytest -q
